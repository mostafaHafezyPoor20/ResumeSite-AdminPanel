plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'mostafa.hafezypoor.ahmmad.panel'
    compileSdk 36

    defaultConfig {
        applicationId "mostafa.hafezypoor.ahmmad.panel"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.adapter.guava
    implementation libs.converter.gson
    implementation libs.circleimageview
    implementation libs.converter.scalars
    implementation libs.picasso
    implementation libs.uploadservice
    implementation libs.lottie
    implementation libs.shimmer
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation libs.sonic.water.wave.animation
    implementation libs.uploadservice.okhttp
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}